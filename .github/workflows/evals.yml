name: Evals

# Runs the 33 scenarios against the real model. It is separate from ci.yml because it needs the
# LLM_API_KEY secret and calls a paid API (about US$ 0.03 a run). Start it by hand from the
# Actions tab, or let the weekly run catch drift in the model behind the same name.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Run the evaluation and compare with the baseline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: >
          python -m emporio.evals
          --baseline evals/results/claude-haiku-5.5-33-cases.json
          --fail-under 0.95
          --report evals-report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: evals-report.json
          if-no-files-found: ignore
